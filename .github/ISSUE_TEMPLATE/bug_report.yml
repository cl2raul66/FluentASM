name: Reporte de error
description: Algo falló al compilar, ensamblar o usar el lenguaje
title: "[Bug]: "
labels:
  - tipo/bug
body:
  - type: markdown
    attributes:
      value: |
        Describe el error con la información mínima para poder reproducirlo.
        Revisa los [issues existentes](../../issues) antes de abrir uno nuevo.
  - type: textarea
    id: que-esperabas
    attributes:
      label: Qué esperabas que pasara
      description: El resultado correcto según la especificación.
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó en realidad
      description: "Pega el mensaje exacto: el código de diagnóstico (`FASMxxxx`) y el texto completo."
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Código mínimo para reproducir
      description: "Fragmento de `sourcesCode.fasm`, `.fproj` o código C# más corto que provoque el fallo."
      render: fasm
  - type: dropdown
    id: componente
    attributes:
      label: Componente afectado
      options:
        - FluentASM.Core
        - FluentASM.Compiler (fluentasm)
        - FluentASM.Lsp
        - FluentASM.IDE
        - FluentASM.Sample
        - FluentASM.Admin (fase futura)
        - Documentación
        - Plantillas / CI (.github)
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: Versión del SDK de .NET
      description: Resultado de `dotnet --version`.
      placeholder: "10.0.100"
    validations:
      required: true
  - type: input
    id: sistema-operativo
    attributes:
      label: Sistema operativo
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15"