name: 🚀 Solicitud de funcionalidad
description: Proponer una nueva característica o mejora para FluentASM.
title: "[FEATURE] <título corto>"
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: ¿A qué parte del proyecto afecta esta solicitud?
      options:
        - "Compilador (Core, Compiler)"
        - "Herramientas (CLI, IDE)"
        - "Ecosistema (.fproj, .fworkspace, admin)"
        - "Documentación y sintaxis"
        - "CI/CD y release"
        - "Otro"
      default: 0
  - type: input
    id: descripcion
    attributes:
      label: Descripción
      description: Descríbe la funcionalidad que se desea agregar.
    validations:
      required: true
  - type: textarea
    id: motivacion
    attributes:
      label: Motivación / Caso de uso
      description: ¿Qué problema resuelve esta característica y para qué escenario se usaría?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta de implementación
      description: Sugiere cómo podría implementarse (opcional).
    validations:
      required: false
  - type: checkboxes
    id: afecta
    attributes:
      label: ¿Afecta a?
      description: Marca los componentes implicados.
      options:
        - label: FluentASM.Core (lexer, parser, semántica, codificador)
        - label: FluentASM.Compiler (CLI fluentasm)
        - label: FluentASM.Lsp (servidor de lenguaje)
        - label: FluentASM_IDE (editor, resaltado, undo)
        - label: FluentASM.Sample (validación manual)
        - label: Documentación (CONTRIBUTING, FLUENT_SYNTAX)
  - type: checkboxes
    id: fase
    attributes:
      label: Fase del roadmap
      options:
        - label: Fase 1 (actual)
        - label: Fase 2 y posteriores
        - label: No aplica / transversal
