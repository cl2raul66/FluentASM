name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Compilar y validar
    runs-on: windows-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Leer la versión del proyecto
        shell: pwsh
        run: Write-Host "FluentASM $(Get-Content VERSION)"

      - name: Restaurar dependencias
        run: dotnet restore src/FluentASM.slnx

      - name: Compilar (advertencias como errores)
        run: dotnet build src/FluentASM.slnx --no-restore --configuration Release

      - name: Validar el proyecto de ejemplo
        run: >
          dotnet run --project src/FluentASM.Compiler --configuration Release --no-build --
          build src/miCalculadoraCli/miCalculadoraCli.fproj
