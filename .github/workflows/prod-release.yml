name: Prod Release (main)

# Publica la version estable al mergear develop en main.
# El PR de promocion declara las MISMAS lineas ver(...) del ciclo (con -preview);
# este flujo quita el sufijo -preview y publica x.y.z.
# Regla: solo se publica si la version es ESTRICTAMENTE MAYOR que la ultima estable.
# Si es igual o menor, el job termina sin publicar y sin fallar.

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: prod-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout main (con historial y etiquetas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer versiones del PR de promocion
        id: parse
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = if ([string]::IsNullOrWhiteSpace($env:PR_BODY)) { "" } else { $env:PR_BODY }

          # El PR de promocion escribe 'ver(core): 0.2.0-preview'; la estable es la base sin sufijo.
          function Get-DeclaredVersion([string]$project) {
            $linePattern = '(?im)^[ \t]*ver\(' + [regex]::Escape($project) + '\)[ \t]*:[ \t]*([^\r\n]*?)[ \t]*\r?$'
            if ($body -notmatch $linePattern) { return "" }

            $raw = $Matches[1].Trim()
            if ($raw -eq '' -or $raw -match '^x\.x\.x(-preview)?$') { return "" }

            if ($raw -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-preview)?$') {
              throw "La linea 'ver($project)' no contiene una version valida: '$raw'. Usa MAJOR.MINOR.PATCH o MAJOR.MINOR.PATCH-preview."
            }

            return "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }

          $core = Get-DeclaredVersion 'core'
          $compiler = Get-DeclaredVersion 'compiler'
          $lsp = Get-DeclaredVersion 'lsp'
          $ide = Get-DeclaredVersion 'ide'
          $has = ($core -ne "" -or $compiler -ne "" -or $lsp -ne "" -or $ide -ne "")

          Write-Host "Declarado en el PR -> core: '$core', compiler: '$compiler', lsp: '$lsp', ide: '$ide'"
          if (-not $has) {
            Write-Host "El PR de promocion no declara versiones: no se publica ninguna estable."
            Write-Host "::warning::Sin lineas ver(...) con numeros en el cuerpo del PR: no se publica nada."
          }

          "core=$core" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "lsp=$lsp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ide=$ide" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "has_releases=$($has.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolver versiones estables frente a lo publicado
        id: resolve
        if: steps.parse.outputs.has_releases == 'true'
        shell: pwsh
        env:
          CORE: ${{ steps.parse.outputs.core }}
          COMPILER: ${{ steps.parse.outputs.compiler }}
          LSP: ${{ steps.parse.outputs.lsp }}
          IDE: ${{ steps.parse.outputs.ide }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tags = git tag --list
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron leer las etiquetas del repositorio (git tag)." }

          # Ultima etiqueta 'proyecto-vX.Y.Z<sufijo>' publicada.
          function Get-LatestTagged([string]$project, [string]$suffix) {
            $pattern = '^' + [regex]::Escape("$project-v") + '(\d+\.\d+\.\d+)' + [regex]::Escape($suffix) + '$'
            $found = @()
            foreach ($tag in $tags) {
              if ($tag -match $pattern) { $found += [version]$Matches[1] }
            }
            if ($found.Count -eq 0) { return $null }
            return ($found | Sort-Object | Select-Object -Last 1)
          }

          function Resolve-Project([string]$project, [string]$declared) {
            if ([string]::IsNullOrWhiteSpace($declared)) {
              return @{ Publish = $false; Version = ""; Reason = "sin version en el PR, se omite" }
            }

            if (-not ($tags -contains "$project-v$declared-preview")) {
              Write-Host "::warning::No existe la prerelease '$project-v$declared-preview'; se publica la estable igualmente."
            }

            $target = [version]$declared
            $published = Get-LatestTagged $project ''
            $latestText = if ($null -eq $published) { "ninguna" } else { "$published" }

            if ($null -ne $published -and $target -le $published) {
              return @{ Publish = $false; Version = ""; Reason = "$declared no es mayor que $latestText, se omite" }
            }

            return @{ Publish = $true; Version = "$declared"; Reason = "$declared es mayor que $latestText, se publica" }
          }

          $core = Resolve-Project 'core' "$env:CORE"
          $compiler = Resolve-Project 'compiler' "$env:COMPILER"
          $lsp = Resolve-Project 'lsp' "$env:LSP"
          $ide = Resolve-Project 'ide' "$env:IDE"

          Write-Host "core: $($core.Reason)"
          Write-Host "compiler: $($compiler.Reason)"
          Write-Host "lsp: $($lsp.Reason)"
          Write-Host "ide: $($ide.Reason)"

          "core_publish=$($core.Publish.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "core_version=$($core.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "compiler_publish=$($compiler.Publish.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "compiler_version=$($compiler.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "lsp_publish=$($lsp.Publish.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "lsp_version=$($lsp.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ide_publish=$($ide.Publish.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ide_version=$($ide.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $any = ($core.Publish -or $compiler.Publish -or $lsp.Publish -or $ide.Publish)
          "has_releases=$($any.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 10
        if: steps.resolve.outputs.has_releases == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aplicar versiones y generar ZIPs
        if: steps.resolve.outputs.has_releases == 'true'
        shell: pwsh
        env:
          CORE_PUBLISH: ${{ steps.resolve.outputs.core_publish }}
          CORE_VERSION: ${{ steps.resolve.outputs.core_version }}
          COMPILER_PUBLISH: ${{ steps.resolve.outputs.compiler_publish }}
          COMPILER_VERSION: ${{ steps.resolve.outputs.compiler_version }}
          LSP_PUBLISH: ${{ steps.resolve.outputs.lsp_publish }}
          LSP_VERSION: ${{ steps.resolve.outputs.lsp_version }}
          IDE_PUBLISH: ${{ steps.resolve.outputs.ide_publish }}
          IDE_VERSION: ${{ steps.resolve.outputs.ide_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Set-CsprojVersion([string]$path, [string]$version) {
            [xml]$xml = Get-Content $path -Raw
            $pg = $xml.Project.PropertyGroup | Where-Object { -not $_.Condition } | Select-Object -First 1
            if ($null -eq $pg) {
              $pg = $xml.CreateElement("PropertyGroup")
              $xml.Project.AppendChild($pg) | Out-Null
            }
            $node = $pg.SelectSingleNode("Version")
            if ($null -eq $node) {
              $node = $xml.CreateElement("Version")
              $pg.AppendChild($node) | Out-Null
            }
            $node.InnerText = $version
            $xml.Save((Resolve-Path $path))
          }

          if ($env:CORE_PUBLISH -eq 'true') { Set-CsprojVersion "src/FluentASM.Core/FluentASM.Core.csproj" $env:CORE_VERSION }
          if ($env:COMPILER_PUBLISH -eq 'true') { Set-CsprojVersion "src/FluentASM.Compiler/FluentASM.Compiler.csproj" $env:COMPILER_VERSION }
          if ($env:LSP_PUBLISH -eq 'true') { Set-CsprojVersion "src/FluentASM.Lsp/FluentASM.Lsp.csproj" $env:LSP_VERSION }
          if ($env:IDE_PUBLISH -eq 'true') { Set-CsprojVersion "src/FluentASM_IDE/FluentASM_IDE.csproj" $env:IDE_VERSION }

          dotnet restore src/FluentASM.slnx
          if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet restore de la solucion." }

          dotnet build src/FluentASM.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet build de la solucion en Release." }

          dotnet run --project src/FluentASM.Sample/FluentASM.Sample.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Fallo la suite de validacion FluentASM.Sample." }

          New-Item -ItemType Directory -Force -Path release_zips | Out-Null

          if ($env:CORE_PUBLISH -eq 'true') {
            dotnet publish src/FluentASM.Core/FluentASM.Core.csproj -c Release --no-restore -o release_out/core
            if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet publish de FluentASM.Core." }
            Compress-Archive -Path "release_out/core/*" -DestinationPath "release_zips/FluentASM.Core-v$($env:CORE_VERSION).zip" -Force
          }

          if ($env:COMPILER_PUBLISH -eq 'true') {
            dotnet publish src/FluentASM.Compiler/FluentASM.Compiler.csproj -c Release --no-restore -o release_out/compiler
            if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet publish de FluentASM.Compiler." }
            Compress-Archive -Path "release_out/compiler/*" -DestinationPath "release_zips/FluentASM.Compiler-v$($env:COMPILER_VERSION).zip" -Force
          }

          if ($env:LSP_PUBLISH -eq 'true') {
            dotnet publish src/FluentASM.Lsp/FluentASM.Lsp.csproj -c Release --no-restore -o release_out/lsp
            if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet publish de FluentASM.Lsp." }
            Compress-Archive -Path "release_out/lsp/*" -DestinationPath "release_zips/FluentASM.Lsp-v$($env:LSP_VERSION).zip" -Force
          }

          if ($env:IDE_PUBLISH -eq 'true') {
            # WinUI 3: publicar unpackaged self-contained (sin certificado MSIX) para ejecucion directa en Windows x64
            dotnet publish src/FluentASM_IDE/FluentASM_IDE.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -p:PublishTrimmed=false -o release_out/ide
            if ($LASTEXITCODE -ne 0) { throw "Fallo dotnet publish de FluentASM_IDE." }
            Compress-Archive -Path "release_out/ide/*" -DestinationPath "release_zips/FluentASM.IDE-v$($env:IDE_VERSION).zip" -Force
          }

      - name: Publicar Release Core (estable)
        if: steps.resolve.outputs.core_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-v${{ steps.resolve.outputs.core_version }}
          name: FluentASM.Core v${{ steps.resolve.outputs.core_version }}
          prerelease: false
          generate_release_notes: true
          files: release_zips/FluentASM.Core-v${{ steps.resolve.outputs.core_version }}.zip

      - name: Publicar Release Compiler (estable)
        if: steps.resolve.outputs.compiler_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compiler-v${{ steps.resolve.outputs.compiler_version }}
          name: FluentASM.Compiler v${{ steps.resolve.outputs.compiler_version }}
          prerelease: false
          generate_release_notes: true
          files: release_zips/FluentASM.Compiler-v${{ steps.resolve.outputs.compiler_version }}.zip

      - name: Publicar Release Lsp (estable)
        if: steps.resolve.outputs.lsp_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lsp-v${{ steps.resolve.outputs.lsp_version }}
          name: FluentASM.Lsp v${{ steps.resolve.outputs.lsp_version }}
          prerelease: false
          generate_release_notes: true
          files: release_zips/FluentASM.Lsp-v${{ steps.resolve.outputs.lsp_version }}.zip

      - name: Publicar Release IDE (estable)
        if: steps.resolve.outputs.ide_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ide-v${{ steps.resolve.outputs.ide_version }}
          name: FluentASM_IDE v${{ steps.resolve.outputs.ide_version }}
          prerelease: false
          generate_release_notes: true
          files: release_zips/FluentASM.IDE-v${{ steps.resolve.outputs.ide_version }}.zip
